name: checks

# CI runs the checks that do not call automationexercise.com. The live browser tests run locally
# (npm test, or scripts/flow.sh gate) because the site blocks GitHub-hosted runner IPs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run privacy guard
        run: npm run guard
